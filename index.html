<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nosso Sim</title><style>body{font:16px system-ui;background:#fffdf5;color:#34516e;margin:0}header{text-align:center;background:#dce9f5;padding:30px}h1,h2{font-family:Georgia;font-weight:normal}main{max-width:700px;margin:auto;padding:16px}section{background:white;border:1px solid #dce9f5;border-radius:16px;padding:16px;margin:12px 0}button,input{font:inherit;padding:10px;border:1px solid #b9cce0;border-radius:8px;background:white;color:inherit}button{background:#fff0b7;margin:4px}label{display:block;padding:10px;border-bottom:1px solid #eee}progress{width:100%;accent-color:#8baac7}</style><header>SETEMBRO 2027<h1>Nosso Sim</h1>Um sonho, dois corações</header><main><section><h2>Preparativos</h2><progress id="bar"></progress><p id="count"></p></section><div id="areas"></div><section><h2>Financeiro</h2><div id="fin"></div></section><p>Versão inicial — dados salvos somente neste navegador.</p></main><script>const groups={'Casamento':['Definir orçamento','Confirmar data','Reservar espaço','Lista de convidados','Contratar churrasqueiro','Consultar cartório','Fotógrafo','Música','Decoração','Trajes','Convites','Confirmar presença','Alianças adquiridas'],'Lua de mel':['Passaportes','Orçamento','Roteiro de 10 dias','Passagens','Hospedagem','Transporte','Seguro viagem','Malas'],'Nossa casa':['Cama e colchão','Geladeira','Fogão','Máquina de lavar','Utensílios','Roupas de cama','Sofá','Mesa','Armários']};let s=JSON.parse(localStorage.getItem('nosso-sim-v1')||'null')||{groups,done:{'Alianças adquiridas':true},fin:[10000,0,40000,0]};function save(){localStorage.setItem('nosso-sim-v1',JSON.stringify(s));render()}function render(){areas.replaceChildren();let all=Object.values(s.groups).flat();bar.max=all.length;bar.value=all.filter(x=>s.done[x]).length;count.textContent=bar.value+' de '+all.length+' concluídos';for(let [g,ts] of Object.entries(s.groups)){let sec=document.createElement('section'),h=document.createElement('h2');h.textContent=g;sec.append(h);ts.forEach((t,i)=>{let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=!!s.done[t];c.onchange=()=>{s.done[t]=c.checked;save()};l.append(c,document.createTextNode(' '+t));sec.append(l)});let b=document.createElement('button');b.textContent='+ Tarefa';b.onclick=()=>{let t=prompt('Nova tarefa');if(t){ts.push(t);save()}};sec.append(b);areas.append(sec)}fin.replaceChildren();['Orçamento festa','Guardado festa','Meta viagem e mobília','Guardado viagem e mobília'].forEach((t,i)=>{let l=document.createElement('label'),n=document.createElement('input');n.type='number';n.min=0;n.value=s.fin[i];n.onchange=()=>{s.fin[i]=Math.max(0,Number(n.value)||0);save()};l.append(document.createTextNode(t+' (R$) '),n);fin.append(l)})}render()</script></html>
