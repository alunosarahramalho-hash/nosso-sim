<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nosso Sim</title><style>*{box-sizing:border-box}body{margin:0;background:#fbfaf5;color:#344e68;font:15px system-ui}header{background:#dce8f3;text-align:center;padding:30px}h1,h2,h3{font-family:Georgia;font-weight:normal}h1{font-size:42px;margin:10px}nav{display:flex;overflow:auto;position:sticky;top:0;background:#fffdf7;padding:10px;gap:6px;z-index:2}button,input,select{font:inherit;border:1px solid #b9cce0;border-radius:8px;padding:9px;background:white;color:inherit;max-width:100%}button{cursor:pointer;background:#f8edbd;white-space:nowrap}main{max-width:850px;margin:auto;padding:14px}section,details{background:white;border:1px solid #dce8f3;border-radius:14px;padding:15px;margin:10px 0}summary{cursor:pointer;font-weight:600}label{display:block;margin:8px 0}small{color:#62778a}progress{width:100%;accent-color:#87a9c9}.line{display:flex;gap:8px;align-items:center;border-bottom:1px solid #eee;padding:9px 0}.line span{flex:1}.red{color:#b32635}.green{color:#28724c}.yellow{color:#967000}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}input[type=number]{width:115px}footer{text-align:center;padding:20px}a{color:#345e89}</style><header><small>SETEMBRO • 2027</small><h1>Nosso Sim</h1>Construindo nossa história ♡</header><nav id="nav"></nav><main id="main"></main><footer>Salvamento automático neste navegador · nuvem ainda não conectada</footer><script>
const groups={"Civil":"Confirmar data|Consultar cartório|Regime de bens|Documentos|Testemunhas|Habilitação|Taxas|Certidão|Alianças adquiridas","Local":"Visitar espaços|Capacidade|Área coberta|Banheiros|Acessibilidade|Estacionamento|Cozinha|Churrasqueira|Energia|Ventilação|Horários|Limpeza|Cancelamento","Churrasco":"Comparar propostas|Carnes|Acompanhamentos|Saladas|Restrições alimentares|Equipe|Garçons|Carvão|Louças|Talheres|Copos|Guardanapos|Réchauds|Preço crianças|Convidados extras|Alimentação equipe|Sobras|Contrato","Bebidas":"Água|Refrigerantes|Sucos|Cerveja|Gelo|Caixas térmicas|Refrigeração|Serviço","Mobiliário":"Mesas convidados|Cadeiras|Mesas apoio|Mesa bolo|Mesa buffet|Toalhas|Frete|Montagem|Desmontagem|Caução","Decoração":"Paleta|Arranjos mesas|Flores|Mesa bolo|Painel|Entrada|Placa boas-vindas|Espaço fotos|Iluminação|Montagem","Papelaria":"Monograma|Tipografia|Save the date|Convites digitais|Convites físicos opcionais|Menu|Placas reservado|Etiquetas|Agradecimentos","Noiva":"Vestido|Sapatos|Acessórios|Cabelo|Maquiagem|Teste|Unhas|Ajustes","Noivo":"Traje|Camisa|Sapato|Cinto|Ajustes|Cabelo e barba","Fotografia":"Portfólios|Cobertura|Fotos familiares|Contrato|Prazo entrega","Música":"Banda ou DJ|Som|Repertório|Energia|Contrato","Bolo e doces":"Degustação|Quantidade|Encomenda|Entrega|Suportes","Lembranças":"Definir se haverá|Pesquisar|Encomendar","Kit banheiro":"Papel extra|Lenços|Absorventes|Desodorante|Elásticos|Grampos|Cotonetes|Álcool gel|Fio dental|Curativos|Lixa|Kit costura|Pente","Contingência":"Plano chuva|Calor|Energia|Fornecedor reserva|Responsável imprevistos","Lua de mel":"Passaportes|Datas|Roteiro 10 dias|Passagens|Hospedagem|Trens|Seguro|Documentos|Atrações|Câmbio|Malas","Nossa casa":"Cama|Colchão|Geladeira|Fogão|Máquina lavar|Panelas|Louças|Talheres|Enxoval|Toalhas|Sofá|Mesa|Armários|Cortinas","Pós-casamento":"Devolver aluguéis|Conferir pagamentos|Receber fotos|Agradecimentos"},cats=[['Local',12],['Churrasco',35],['Bebidas',10],['Mobiliário',8],['Decoração',10],['Fotografia',8],['Música',5],['Civil',3],['Extras e reserva',9]],months=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro'];const early=['Civil','Local','Churrasco','Fotografia','Música'];let initial={tasks:Object.entries(groups).flatMap(([g,v])=>v.split('|').map((n,i)=>({g,n,m:early.includes(g)?(i<3?1:2):g==='Pós-casamento'?9:g==='Kit banheiro'?8:g==='Lua de mel'?Math.min(8,2+Math.floor(i/2)):g==='Nossa casa'?5:g==='Contingência'?8:Math.min(8,3+Math.floor(i/3)),p:early.includes(g)&&i<3?1:2,who:'Ambos',done:n==='Alianças adquiridas'}))),budget:10000,saved:6000,travelSaved:20000,travelBudget:20000,limits:cats.map(x=>x[1]),expenses:[],guests:[],vendors:[],inspo:[],day:[['07:00','Montagem'],['08:00','Equipe churrasco'],['11:30','Recepção'],['12:00','Comemoração'],['12:30','Almoço'],['14:00','Bolo e fotos'],['17:00','Encerramento']],calc:{n:120,seats:6,reserve:5,tables:0,chairs:0}};let s;try{s=JSON.parse(localStorage.getItem('nosso-sim-v2'))||initial;if(s===initial){let old=JSON.parse(localStorage.getItem('nosso-sim-v1')||'null');if(old)for(let t of s.tasks)if(old.done[t.n])t.done=true}}catch{s=initial}let tab='Início';const tabs=['Início','Casamento','Financeiro','Convidados','Fornecedores','Calculadoras','Cronograma','Grande dia','Lua de mel','Nossa casa','Inspirações'];const money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('nosso-sim-v2',JSON.stringify(s));render()}function go(t){tab=t;render()}function num(k,v){s[k]=Math.max(0,Number(v)||0);save()}function task(t){let i=s.tasks.indexOf(t);return '<div class="line"><input type="checkbox" '+(t.done?'checked':'')+' onchange="s.tasks['+i+'].done=this.checked;save()"><span>'+esc(t.n)+'<br><small>'+months[t.m-1]+' · P'+t.p+' · '+esc(t.who)+'</small></span><button onclick="edit('+i+')">Editar</button></div>'}function edit(i){let t=s.tasks[i],n=prompt('Tarefa (vazio para excluir)',t.n);if(n===null)return;if(!n){if(confirm('Excluir?'))s.tasks.splice(i,1);save();return}t.n=n;t.m=Math.max(1,Math.min(9,Number(prompt('Mês 1–9',t.m))||t.m));t.p=Math.max(1,Math.min(4,Number(prompt('Prioridade 1–4',t.p))||t.p));t.who=prompt('Responsável',t.who)||t.who;save()}function add(g){let n=prompt('Nova tarefa');if(n){s.tasks.push({g,n,m:1,p:2,who:'Ambos',done:false});save()}}function group(g){let a=s.tasks.filter(t=>t.g===g);return '<details><summary>'+esc(g)+' · '+a.filter(t=>t.done).length+'/'+a.length+'</summary><progress max="'+Math.max(1,a.length)+'" value="'+a.filter(t=>t.done).length+'"></progress>'+a.sort((a,b)=>a.done-b.done||a.p-b.p||a.m-b.m).map(task).join('')+'<button onclick="add(\''+g+'\')">+ Tarefa</button></details>'}function rec(k,i=-1){let schemas={expenses:['Categoria (use nome exato)','Descrição','Cotado R$','Contratado R$','Pago R$','Vencimento'],guests:['Nome','Família','RSVP','Mesa','Restrição alimentar'],vendors:['Nome','Categoria','Contato','Valor','Inclusões','Contrato / link'],inspo:['Título','Categoria','Link','Observação'],day:['Horário','Atividade','Responsável']};let r=s[k][i]||[],v=[];for(let j=0;j<schemas[k].length;j++){let x=prompt(schemas[k][j],r[j]||'');if(x===null)return;v.push(x)}if(i<0)s[k].push(v);else s[k][i]=v;save()}function records(k){return '<button onclick="rec(\''+k+'\')">+ Adicionar</button>'+s[k].map((r,i)=>'<div class="line"><span>'+r.map(esc).join(' · ')+'</span><button onclick="rec(\''+k+'\','+i+')">Editar</button><button onclick="if(confirm(\'Excluir?\')){s.'+k+'.splice('+i+',1);save()}">×</button></div>').join('')}function total(r){return Math.max(0,Number(r[3])||Number(r[2])||0)}function render(){nav.innerHTML=tabs.map(t=>'<button onclick="go(\''+t+'\')">'+t+'</button>').join('');let h='',sum=s.expenses.reduce((a,r)=>a+total(r),0),done=s.tasks.filter(t=>t.done).length;if(tab==='Início'){h='<section><h2>Nosso grande dia</h2><div class="grid"><div>Festa guardado<h2>'+money(s.saved)+'</h2>Meta '+money(s.budget)+'</div><div>Viagem + casa<h2>'+money(s.travelSaved)+'</h2>Meta R$ 40.000</div><div class="'+(sum>s.budget?'red':'green')+'">Saldo previsto<h2>'+money(s.budget-sum)+'</h2></div></div><progress max="'+s.tasks.length+'" value="'+done+'"></progress>'+done+' de '+s.tasks.length+' tarefas</section><section><h2>Nosso próximo passo</h2>'+s.tasks.filter(t=>!t.done).sort((a,b)=>a.p-b.p||a.m-b.m).slice(0,8).map(task).join('')+'</section>'}else if(tab==='Casamento'){h=Object.keys(groups).filter(g=>!['Lua de mel','Nossa casa'].includes(g)).map(group).join('')}else if(groups[tab]){h=group(tab)}else if(tab==='Financeiro'){h='<section><h2>Metas</h2>'+[['budget','Orçamento festa'],['saved','Guardado festa'],['travelSaved','Guardado viagem + casa'],['travelBudget','Limite viagem']].map(([k,l])=>'<label>'+l+' <input type="number" min="0" value="'+s[k]+'" onchange="num(\''+k+'\',this.value)"></label>').join('')+'<p>Limite mobília: '+money(40000-s.travelBudget)+'</p><button onclick="num(\'budget\',10000)">Garantido</button><button onclick="num(\'budget\',15000)">Ideal</button><h2 class="'+(sum>s.budget?'red':'green')+'">Saldo '+money(s.budget-sum)+'</h2></section><section><h2>Limites por categoria</h2><small>Percentuais sugeridos, não médias de mercado. Total: '+s.limits.reduce((a,b)=>a+b,0)+'%</small>'+cats.map(([c],i)=>{let v=s.expenses.filter(r=>r[0]===c).reduce((a,r)=>a+total(r),0),l=s.budget*s.limits[i]/100;return '<div class="line"><span>'+c+'<br><small>Limite '+money(l)+'</small></span><input type="number" min="0" value="'+s.limits[i]+'" onchange="s.limits['+i+']=Math.max(0,Number(this.value)||0);save()">% <strong class="'+(v>l?'red':v>=l*.9&&v?'yellow':v?'green':'')+'">'+money(v)+'</strong></div>'}).join('')+'</section><section><h2>Despesas</h2><small>Categorias: '+cats.map(x=>x[0]).join(', ')+'</small>'+records('expenses')+'<p>Previsto '+money(sum)+' · Pago '+money(s.expenses.reduce((a,r)=>a+(Number(r[4])||0),0))+'</p></section>'}else if(tab==='Calculadoras'){let c=s.calc,n=Math.ceil(c.n*(1+c.reserve/100)),t=Math.ceil(n/Math.max(1,c.seats));h='<section><h2>Mobiliário</h2>'+[['n','Convidados'],['seats','Lugares por mesa'],['reserve','Reserva %'],['tables','Mesas inclusas'],['chairs','Cadeiras inclusas']].map(([k,l])=>'<label>'+l+' <input type="number" min="0" value="'+c[k]+'" onchange="s.calc.'+k+'=Math.max(0,Number(this.value)||0);save()"></label>').join('')+'<h2>'+Math.max(0,t-c.tables)+' mesas · '+Math.max(0,n-c.chairs)+' cadeiras a alugar</h2><p>'+t+' toalhas e arranjos. Mesas de apoio não inclusas.</p></section><section><h2>Alimentação e bebidas</h2>Calculadora de consumo pendente de validação das fontes. Confira o pacote do churrasqueiro no checklist.</section>'}else if(tab==='Cronograma'){h=months.map((m,i)=>'<details><summary>'+m+'</summary>'+s.tasks.filter(t=>t.m===i+1).sort((a,b)=>a.p-b.p).map(task).join('')+'</details>').join('')}else{let k={'Convidados':'guests','Fornecedores':'vendors','Inspirações':'inspo','Grande dia':'day'}[tab];h='<section><h2>'+tab+'</h2>'+records(k)+'</section>'}main.innerHTML=h}render()</script></html>
